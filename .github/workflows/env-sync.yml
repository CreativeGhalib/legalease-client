name: Sync Prod Env → Vercel

# VITE_* variables must exist at Vite build time. The plain `vercel deploy`
# job exports them as shell env vars, which never reach Vercel's remote build
# — so GA4 was silently absent from the production bundle. This workflow
# writes the build-time variables into the Vercel production environment via
# the Vercel REST API, then redeploys. Secret values are never printed.

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/env-sync.yml'
  workflow_dispatch:

jobs:
  sync:
    name: Sync VITE_* to Vercel prod env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync environment into Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          ENV_SPEC: >-
            VITE_API_BASE_URL,
            VITE_GOOGLE_CLIENT_ID,
            VITE_SENTRY_DSN,
            VITE_GA4_MEASUREMENT_ID
        run: |
          cat > /tmp/vercel-env-sync.mjs <<'EOF'
          const token = process.env.VERCEL_TOKEN
          const teamId = process.env.VERCEL_ORG_ID
          const projectId = process.env.VERCEL_PROJECT_ID
          if (!token || !teamId || !projectId) {
            console.error('Missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_FRONTEND_PROJECT_ID')
            process.exit(1)
          }
          const names = process.env.ENV_SPEC.split(',').map(s => s.trim()).filter(Boolean)
          const api = (path, opts = {}) =>
            fetch(`https://api.vercel.com${path}${path.includes('?') ? '&' : '?'}teamId=${teamId}`, {
              ...opts,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) }
            }).then(async r => ({ status: r.status, body: await r.text() }))

          let setCount = 0
          for (const name of names) {
            const value = process.env[name]
            if (!value) { console.log(`SKIP ${name} (not set in GitHub Secrets)`); continue }
            const res = await api(`/v9/projects/${projectId}/env?upsert=true&target=production`, {
              method: 'POST',
              body: JSON.stringify({ key: name, value, type: 'encrypted', target: ['production'] })
            })
            if (res.status === 201 || res.status === 200) { console.log(`SET ${name} (production)`); setCount++ }
            else console.log(`WARN ${name} -> HTTP ${res.status}: ${res.body.slice(0, 200)}`)
          }
          console.log(`Synced ${setCount}/${names.length} variables`)
          EOF
          node /tmp/vercel-env-sync.mjs

      - name: Redeploy production with new env
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
