<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LegalEase — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      background: #f8f5ef;
      color: #1b3a6b;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 40px rgba(27,58,107,.10);
      max-width: 360px;
      width: 90%;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: #1b3a6b;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg { fill: #d4a843; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; }
    p { font-size: .95rem; color: #69798e; line-height: 1.6; }
    button {
      margin-top: 24px;
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      background: #1b3a6b;
      color: #fff;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #143060; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 40 40" width="36" height="36">
        <path d="M20 4 L8 14 L10 16 L20 8 L30 16 L32 14 Z"/>
        <path d="M13 18 L10 28 L16 28 Z"/>
        <path d="M27 18 L24 28 L30 28 Z"/>
        <rect x="10" y="30" width="20" height="2" rx="1"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>LegalEase requires an internet connection.<br />Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
